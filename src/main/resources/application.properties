# Spring Application Name
spring.application.name=taskmaster-backend

# Spring DataSource Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmaster_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.database: postgresql
spring.jpa.show-sql: true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto: update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql: true
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=pe.edu.upc.taskmaster.backend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# JWT Configuration Properties
authorization.jwt.secret = WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days = 7

# Habilitar endpoints de metricas
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6Iz_b74PUSv1n37uDcmKII5swZWrixAR5T-2QPT1WeOZA}
gemini.api.model=gemini-3.1-flash-lite
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.api.timeout=60000
